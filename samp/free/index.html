<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自動スライドスケジュール</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <style>
    .active { font-weight: bold; }
    .shukkin-list-container div { display: none; }
  </style>
</head>
<body>
  <div id="contents">
    <div class="pcwidgets_shukkin">
      <ul class="shukkin-controller week"></ul>
      <div class="shukkin-list-container"></div>
    </div>
  </div>

  <script>
    $(document).ready(function () {
      const DAYS = 7;
      const ROOT_KEY = 'shukkin_data';
      
      // 📅 日付の生成
      function getFormattedDate(offset = 0) {
        const date = new Date();
        date.setDate(date.getDate() + offset);
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      // 📦 データの保存
      function saveData(data) {
        localStorage.setItem(ROOT_KEY, JSON.stringify(data));
      }

      // 📦 データの取得
      function loadData() {
        const savedData = localStorage.getItem(ROOT_KEY);
        return savedData ? JSON.parse(savedData) : {};
      }

      // 🕛 スライド処理
      function slideData(data) {
        const newData = {};
        for (let i = 1; i < DAYS; i++) {
          const currentDate = getFormattedDate(i);
          const nextDate = getFormattedDate(i - 1);
          newData[nextDate] = data[currentDate] || []; // 翌日分を前日に移動
        }
        newData[getFormattedDate(DAYS - 1)] = []; // 最終日を空にする
        saveData(newData);
        return newData;
      }

      // 🌙 日付が変わった時に自動スライド
      function checkForSlide(data) {
        const today = getFormattedDate();
        const lastChecked = localStorage.getItem('last_checked_date');

        if (lastChecked !== today) {
          data = slideData(data);
          localStorage.setItem('last_checked_date', today);
        }
        return data;
      }

      // 📄 初期データ生成
      function initData() {
        const data = loadData();
        return checkForSlide(data);
      }

      // 📅 スケジュールをUIに描画
      function renderSchedule(data) {
        const weekContainer = $('.shukkin-controller.week');
        const castContainer = $('.shukkin-list-container');
        weekContainer.empty();
        castContainer.empty();

        for (let i = 0; i < DAYS; i++) {
          const dateStr = getFormattedDate(i);
          const date = new Date(dateStr);
          const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
          const dayName = dayNames[date.getDay()];
          const dayClass = `day-${i}`;
          
          weekContainer.append(`<li class="${dayClass}">${dateStr} (${dayName})</li>`);

          const castList = data[dateStr] || [];
          const castHtml = castList.length ? castList.map(cast => `<p>${cast}</p>`).join('') : '<p>データなし</p>';
          castContainer.append(`<div class="${dayClass}">${castHtml}</div>`);
        }

        $('.shukkin-controller.week li').click(function () {
          const clickedClass = $(this).attr('class');
          castContainer.children('div').hide();
          castContainer.children(`div.${clickedClass}`).show();
          $('.shukkin-controller.week li').removeClass('active');
          $(this).addClass('active');
        });

        $('.shukkin-controller.week li:first').click();
      }

      // 📝 データを追加する関数
      function addCast(dateStr, castName) {
        const data = loadData();
        if (!data[dateStr]) data[dateStr] = [];
        data[dateStr].push(castName);
        saveData(data);
        renderSchedule(data);
      }

      // 📊 初期化
      let data = initData();
      renderSchedule(data);

      // 💡 デモ用キャスト追加 (実際にはフォーム等で行う)
      addCast(getFormattedDate(0), "今日のキャスト");
      addCast(getFormattedDate(1), "明日のキャスト");
      addCast(getFormattedDate(2), "明後日のキャスト");
      addCast(getFormattedDate(3), "3日後のキャスト");
      addCast(getFormattedDate(4), "4日後のキャスト");
      addCast(getFormattedDate(5), "5日後のキャスト");
      addCast(getFormattedDate(6), "6日後のキャスト");

    });
  </script>
</body>
</html>
